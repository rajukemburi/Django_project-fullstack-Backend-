<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}E-Commerce{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body style="background-color:lightblue;">
  <nav class="navbar navbar-expand-lg navbar-light bg-light" style="height: 5rem;">
    <a class="navbar-brand" href="/">MyShop</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'cart-detail' %}">Cart</a></li>
      </ul>
      <ul class="navbar-nav" >
        {% if user.is_authenticated %}
        <li class="nav-item"><a class="nav-link" href="#">{{ user.username }}</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a> </li>
        {% else %}
        <li class="nav-item"><a class="nav-link" href="/admin/login/">Admin Login</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">User Login</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>

  <div class="container mt-4">
    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

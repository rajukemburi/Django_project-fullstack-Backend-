{% extends 'base.html' %}
{% block content %}
<h2>Order #{{ order.id }}</h2>
<p>Status: {{ order.status }}</p>
<p>Total: ₹{{ order.total_price }}</p>
<table class="table">
  <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
  <tbody>
    {% for item in order.items.all %}
      <tr>
        <td>{{ item.product.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>₹{{ item.price }}</td>
        <td>₹{{ item.subtotal }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

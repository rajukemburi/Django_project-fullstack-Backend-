{% extends 'base.html' %}
{% block content %}
<h2>Your Cart</h2>
<table class="table">
  <thead>
    <tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr>
  </thead>
  <tbody>
    {% for item in items %}
      <tr>
        <td>{{ item.product.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>₹{{ item.product.price }}</td>
        <td>₹{{ item.subtotal }}</td>
        <td><a href="{% url 'remove-from-cart' item.id %}" class="btn btn-danger btn-sm">Remove</a></td>
      </tr>
    {% endfor %}
  </tbody>
</table>
<h4>Total: ₹{{ total }}</h4>
<a href="{% url 'checkout' %}" class="btn btn-success">Checkout</a>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Products{% endblock %}
{% block content %}
<h1>Products</h1>
<form method="get" class="form-inline mb-3">
  <input type="text" name="q" class="form-control mr-2" placeholder="Search..." value="{{ request.GET.q }}">
  <button class="btn btn-primary">Search</button>
</form>
<div class="row">
  {% for product in products %}
    <div class="col-md-3 mb-3">
      <div class="card">
        {% if product.image %}
          <img src="{{ product.image.url }}" class="card-img-top" style="height:200px;object-fit:cover;">
        {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">₹{{ product.price }}</p>
          <a href="{% url 'product-detail' product.slug %}" class="btn btn-sm btn-outline-primary">View</a>
          <a href="{% url 'add-to-cart' product.id %}" class="btn btn-sm btn-primary">Add to Cart</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>No products found.</p>
  {% endfor %}
</div>
{% endblock %}

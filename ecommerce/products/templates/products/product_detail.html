{% extends 'base.html' %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    {% if product.image %}
      <img src="{{ product.image.url }}" class="img-fluid">
    {% endif %}
  </div>
  <div class="col-md-6">
    <h2>{{ product.name }}</h2>
    <p>Price: ₹{{ product.price }}</p>
    <p>{{ product.description }}</p>
    <a href="{% url 'add-to-cart' product.id %}" class="btn btn-primary">Add to Cart</a>
  </div>
</div>
{% endblock %}
